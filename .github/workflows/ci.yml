name: CI - Build & Test Backend

on:
  push:
    branches:
      - main
      - 'dev-*'
  pull_request:
    branches:
      - main
      - 'dev-*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Cache NuGet
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Configurar .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ./FitRank-API.sln

      - name: Build
        run: dotnet build ./FitRank-API.sln --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test ./FitRank-API.sln --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.xml'
